# Справочник сегмента «наружная реклама недвижимости».
#
# Три роли рекламодателя, они же три раздела: застройщики, агентства, банки
# с ипотечными продуктами. Локальный ритейл и общепит из справочника убраны —
# фокус проекта сузился до недвижимости, и наполнять справочник тысячами
# локальных брендов больше не требуется. Это и было прежним узким местом.
#
# ЖК и застройщик — РАЗНЫЕ сущности. «Квартал Домашний» — это жилой комплекс,
# застройщик у него «Самолёт». Поэтому названия ЖК живут в отдельном ключе
# complexes и резолвятся в застройщика, а не подменяют его.
#
# Контакты отсюда попадают в ОТДЕЛЬНЫЕ колонки Excel и никогда не смешиваются
# с прочитанными со щита: со щита читается надёжно только крупный шрифт.

brands:
  # ---- застройщики ----
  Самолёт:
    role: застройщик
    aliases: [самолёт, самолет, samolet, "samolet.ru", гк самолет, группа самолет]
    complexes: [квартал домашний, эко бунино, остафьево, квартал ивакино,
                мытищи парк, спутник, тропарево парк, новое внуково]
    site: samolet.ru
    phone: "+74951503366"

  ПИК:
    role: застройщик
