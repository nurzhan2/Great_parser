# Справочник рекламодателей: алиасы для нормализации + контакты для обогащения.
#
# Зачем алиасы: VLM возвращает то, что написано на щите — «Wildberries», «WB»,
# «вайлдберриз», «ВБ». Это один рекламодатель, и без приведения к каноничному
# имени база не группируется. Замер: «День Индии» и «India Day» на соседних
# щитах считались разными брендами.
#
# Зачем контакты здесь: со щита они читаются надёжно только при крупном шрифте
# (замер: 1 верный сайт из 4 на мелком). Контакты из этого файла — совсем
# другие по надёжности данные, поэтому в базе и в Excel они лежат в отдельных
# колонках и НИКОГДА не смешиваются с прочитанным со щита.
#
# Наполнено по брендам, реально встреченным на тестовом обходе Люблинской,
# плюс крупные федеральные рекламодатели наружки. Пополняется вручную.

