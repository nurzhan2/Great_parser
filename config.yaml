# Конфигурация парсера баннеров.
# Значения можно переопределять через переменные окружения BP_* или флаги CLI.

http:
  user_agent: "Mozilla/5.0"
  referer: "https://yandex.ru/maps/"
  timeout: 25
  max_retries: 3
  # Анти-блок: пауза между запросами (сек) и пул прокси.
  min_delay: 0.15
  proxies: []          # напр. ["http://user:pass@host:port", ...]

panorama:
  # Замер на эталоне: zoom 2 -> 3 дал детекцию 13.5 с вместо 22.6 и втрое
  # меньше кандидатов (3 против 8), то есть втрое меньше вызовов OCR.
  # Эталонная табличка при этом находится со score 0.63 против 0.64 —
  # качество не просело. Детекция занимает 59% времени обхода, так что
  # это самый дешёвый способ поднять пропускную способность.
  overview_zoom: 3     # зум обзорной сшивки для детекции (0=макс, 4=мин)
  crop_zoom: 0         # зум для финального кропа баннера (0 = максимум)
  tile_workers: 16

detector:
  # backend: region (ручные регионы) | yolo (обученный) | owlv2 (zero-shot, авто)
  backend: owlv2
  owl_model: "google/owlv2-base-patch16-ensemble"
  # Замер на 179 записях при 0.22: 118 из них (66%) имели score ниже 0.40,
  # то есть большая часть сохранённого — слабые срабатывания. Поднято до 0.30.
  conf: 0.30            # порог детекции; ниже — больше находок и больше ложных
  yolo_weights: "weights/banner_yolo.pt"
  # Промпты OWLv2. Детекция сохраняется, только если лучшая метка попала
  # в prompts; всё, что модель отнесла к negative_prompts, отбрасывается.
  # Без отвлекающих классов у модели нет варианта «это не реклама», и
  # рекламной меткой помечаются дорожные знаки, фонари, детские площадки
  # и таблички с адресом (замерено: точность 10% против 100% с ними).
  # Промпты описывают САМ ОБЪЕКТ, а не то, к чему он прикреплён.
  # Прежние формулировки «attached to a fence» / «banner on a fence»
  # заставляли OWLv2 локализовать ЗАБОР: 78 кандидатов на панораму, из них
  # 117 из 141 сохранённой записи — пустые секции профнастила без текста,
  # а потолок разбора в 40 кропов выбивался на ВСЕХ 44 панорамах (1695
  # кандидатов из 3455 не были показаны OCR ни разу).
  #
  # Замер на трёх панорамах Ильинской, старые -> новые:
  #   Шоссейная 172А:  92 -> 39 кандидатов, крупных рамок 6 -> 0, score 0.54 -> 0.68
  #   Зелёная 8/1:     43 -> 16, крупных 2 -> 0
  #   Санаторная 14:   32 ->  3, крупных 2 -> 0
  # Эталонная табличка «ПРОДАЮ 8-985-970-19-42» после замены стала детекцией
  # №1 и прочиталась точнее прежнего.
  #
  # Первые две строки — про красный прямоугольник с белым текстом: это самый
  # частый вид таких табличек, а для zero-shot детектора цвет и форма —
  # сигнал куда более сильный, чем смысловое описание.
  # Сужено до объявлений о недвижимости. Общие формулировки — «a small
  # rectangular sign with printed text», «a printed announcement sheet» —
  # ловили ДОМОВЫЕ АДРЕСНЫЕ ТАБЛИЧКИ: «19 ул. Береговая», «улица СОВЕТСКАЯ
  # 33», голые номера «50», «14». На жилой улице их по одной на каждый дом,
  # то есть сотни на район, и они тоже красные прямоугольники с белым
  # текстом. Именно они и составляли основную массу мусора в таблице.
  #
  # Бумажные оставлены, но только с упоминанием недвижимости: объявление
  # «куплю участок можно с домом, 8-985-979-12-99, Андрей» висело на БЕЛОМ
  # листе, при строгом отборе по красному оно бы потерялось.
  prompts:
    - "a red sign with white text about property"
    - "a red rectangular placard with a phone number"
    - "a red banner advertising a house or land for sale"
    - "a house for sale sign with a phone number"
    - "a land or plot for sale sign"
    - "a property for sale or rent advertisement by owner"
    - "a handwritten notice offering to buy a house or land"
    - "a paper notice with a phone number about property"
  # Отвлекающие классы описывают ТОЛЬКО мусор, но не фон целевых объектов.
  # Прежний список содержал «a residential apartment building», «trees and
  # bushes» и «a wall with graffiti» — это фон баннера на ограждении, и такие
  # классы перехватывали законные детекции.
  negative_prompts:
    - "a road traffic sign"
    - "a street name or address sign"
    - "a permanent storefront name sign"
    - "a business logo sign"
    - "a government or municipal information sign"
    - "a public transport sign"
    - "a vehicle license plate"
    - "a commercial product billboard"
    - "a professional real estate developer billboard"
    - "a new housing development billboard"
    - "a real estate agency billboard"
    - "an event or promotional poster"
    # Забор и стена — фон целевого объявления, и в комментарии выше стоит
    # предупреждение, что фоновые классы перехватывают законные детекции.
    # Здесь это безопасно из-за neg_margin=0.10: чтобы отбросить, негатив
    # должен ПРЕВЗОЙТИ позитив на 0.10. На тесной рамке вокруг таблички
    # этого не происходит, на рамке вокруг секции профнастила — происходит.
    # Проверено регрессией: эталон после добавления сохранился (score 0.68).
    - "a wooden fence"
    - "a corrugated metal fence"
    - "a brick wall"
    - "a metal gate"
    - "a concrete wall"
    # Адресные таблички — главный источник мусора на жилых улицах.
    # Замер: из 18 непустых текстов в последних 60 записях 11 оказались
    # адресами домов или голыми номерами.
    - "a house number plate"
    - "a street name sign"
    - "an address plate on a building wall"
    - "a building number sign"
  # Margin-фильтр вместо argmax по всем запросам. Отбрасываем не то, где
  # отвлекающий класс победил на сотые доли, а только то, где он доминирует.
  # Спорное уходит дальше — ниже по конвейеру стоит OCR, он точнее.
  # Значения стартовые: score OWLv2 не откалиброван, подбирать по разметке.
  pos_strong: 0.25     # уверенно похоже — берём независимо от отвлекающих
  # Было 0.10 — именно этот порог, а не detector.conf, пропускал в базу
  # записи со score 0.11. У пустых заборов медиана score 0.36, у записей
  # с текстом 0.47, у эталонной таблички 0.68.
  pos_weak: 0.28       # слабо похоже — берём, если мусор не доминирует
  neg_margin: 0.10     # насколько отвлекающий должен превзойти, чтобы отбросить
  # Потолок сохраняемых баннеров с одной панорамы: на одной панораме бывает
  # 180+ детекций, без потолка ограждение даст сотню записей за визит.
  max_per_panorama: 10
  # Сколько детекций вообще разбирать (кроп в макс.зуме + OCR — дорогие).
  max_candidates: 40
  # Отбраковка по размеру будущего кропа в пикселях макс.зума. Проверяется ДО
  # скачивания тайлов. Замер на 61 кропе: размер НЕ разделяет рекламу и мусор
  # (медиана минимальной стороны 143 px у настоящих против 184 px у ложных),
  # поэтому это фильтр пригодности, а не точности: мелкое нечитаемо, огромное —
  # забор или стена во весь кадр. На тестовой выборке отсекает 8 ложных из 22
  # ценой 2 настоящих из 39.
  min_crop_side: 30
  min_crop_area: 1200
  max_crop_area: 800000
  # Отступ вокруг бокса при кропе — доля РАЗМЕРА БОКСА (не панорамы).
  # При 0 текст режется по краям.
  # Было 0.10 — всё равно резало: VLM возвращал 'ВСЁ ДЛ', 'TERRA DRIV'
  # и телефон '+7 (499) 400 10-4...' с обрывом. Телефон обычно у нижней
  # или боковой кромки щита, т.е. ровно там, где не хватало отступа.
  crop_pad: 0.20
  # Выпрямлять кроп в перспективу. Бокс детектора приходит из перспективного
  # вида, а режется по осепараллельному прямоугольнику в equirect: область
  # получается кривой, текст заваливается трапецией, бокс раздувается.
  rectify: true
  # Для backend=region: нормализованные регионы (fx0,fy0,fx1,fy1) — демо/ручной режим.
  regions: []

verify:
  # Проверка, что кроп — рекламный баннер (а не стена/небо/дорога).
  enabled: true
  backend: heuristic   # heuristic (без зависимостей) | clip (zero-shot, open-clip)
  min_edge_density: 0.025
  min_colorfulness: 18.0
  min_saturation: 0.12
  clip_threshold: 0.5
  paper_min_bright_ratio: 0.45
  paper_min_dark_ratio: 0.01
  paper_min_contrast: 18.0

ocr:
  enabled: true
  # Движок: easyocr | paddle | vlm (Anthropic) | openai. Замер показал, что easyocr упирается в 31%
  # распознанных слов и ни одна его настройка не помогает — это вопрос выбора
  # движка, поэтому он вынесен в конфиг и переключается без правки кода.
  # easyocr: бесплатно и локально. Буквы коверкает, но цифры сохраняет,
  # а номер всё равно считывает оператор по ссылке на панораму.
  backend: easyocr
  languages: ["ru", "en"]
  gpu: false           # на сервере CPU; true даёт только предупреждение
  paddle_lang: ru
  # VLM даёт разом текст, рекламодателя и тему. Ключ берётся ТОЛЬКО из
  # переменной окружения ANTHROPIC_API_KEY — в конфиг и git он не попадает.
  # Haiku 4.5 ($1/$5 за 1M токенов) против Sonnet 4.6 ($3/$15) — втрое
  # дешевле. При 12 вызовах на панораму это ~$0.03 против ~$0.09.
  # Если качество чтения мелкого текста просядет — claude-sonnet-5
  # ($2/$10) всё равно дешевле прежнего Sonnet 4.6.
  vlm_model: claude-haiku-4-5-20251001
  # OpenAI: ключ из OPENAI_API_KEY. gpt-4o-mini дешевле gpt-4o
  # примерно в 17 раз при сопоставимом чтении крупного текста.
  openai_model: gpt-4o-mini
  # Gemini: ключ из GEMINI_API_KEY. Flash-модели есть на бесплатном тарифе
  # Gemini Developer API. Точный ID модели проверяйте на ai.google.dev —
  # строки моделей у Google меняются чаще, чем у остальных.
  gemini_model: gemini-2.5-flash
  # DeepSeek: ключ из DEEPSEEK_API_KEY. Дешевле всех доступных с Бегета.
  # deepseek_tile=true режет крупный кроп на 2x2 с перехлёстом — обход
  # потолка в 384 токена на изображение. Выключать только для замера разницы.
  deepseek_model: deepseek-v4-flash-vision-exp
  # Нарезка выключена: она нужна была, чтобы ТОЧНО прочитать цифры номера
  # (5 картинок вместо одной, 1920 токенов вместо 384). В режиме, где номер
  # считывает оператор по ссылке на панораму, такая точность не нужна —
  # достаточно определить, что объявление про недвижимость. Втрое дешевле.
  deepseek_tile: false
  vlm_max_side: 1024   # больше сторона — дороже по токенам
  vlm_max_retries: 4
  cloud_min_side: 120
  max_cloud_calls_per_panorama: 12
  # Ниже этой минимальной стороны кропа контакты помечаются ненадёжными.
  # Замер: на кропе 291x108 px телефон 8(985)277-78-79 распознался как
  # 227-78-70, а kinomax.ru как kinomaks.ru. Данных на таком кропе физически
  # нет — это предел съёмки, а не движка. Правдоподобный, но неверный номер
  # хуже отсутствующего, поэтому такие контакты не выдаются как проверенные.
  contacts_min_side: 220
  # Кэш результатов по хэшу кропа: повторный прогон не стоит денег и времени.
  cache_path: "data/ocr_cache.sqlite"

classify:
  # backend: keyword | clip
  backend: keyword
  categories:
    - недвижимость
    - авто
    - финансы
    - медицина
    - ретейл
    - услуги
    - развлечения
    - другое
    # OCR ничего не дал — тема неизвестна. Такие баннеры СОБИРАЮТСЯ,
    # но по умолчанию не попадают в выгрузку с фильтром темы.
    - не определено

filter:
  # Строгий режим: в базу и таблицу попадают ТОЛЬКО объявления, где в тексте
  # есть слово о продаже или аренде И извлечён телефон. Всё остальное
  # отбрасывается после OCR. Включено осознанно: сбор «всего подряд» давал
  # сотни адресных табличек и пустых заборов на несколько реальных лидов.
  strict_leads: true
  # Телефон не обязателен: оператор открывает ссылку на панораму и считывает
  # номер с фотографии сам. Это надёжнее — он видит оригинал и не получит
  # номер с потерянной цифрой, как выдавали локальные модели на тесте.
  require_phone: false
  # digits — лид определяется наличием текста с числом, похожим на телефон.
  # Тему и тип рекламодателя локальный OCR не даёт, поэтому отбор по ним
  # невозможен: отбирает оператор, открыв панораму.
  # realty_digits — в тексте есть слово о недвижимости И число в формате
  # телефона. Правильность цифр не проверяется: номер считывает оператор
  # по ссылке на панораму. Прежний режим digits брал любой текст с цифрами
  # и пропускал «Среда 8.00-17.00» и «СТОМАТОЛОГИЯ ЗУБАРИКИ».
  # realty_word — только слово о недвижимости в тексте, номер не требуется.
  # На красных табличках easyocr цифры не читает вообще (проверено: инверсия,
  # увеличение, алфавит из цифр — всё мимо), а слово «ПРОДАЮ» берёт. Номер
  # считывает оператор по ссылке. Замер: 3 из 3 объявлений, 0 из 6 мусора.
  mode: realty_word
  # Тема для ВЫГРУЗКИ (export), а не для сбора. Собирается всё, что прошло
  # детекцию и verify; фильтр применяется при экспорте, где его можно снять
  # флагом --all. null = выгружать все темы.
  only_category: недвижимость

crawl:
  # Рамка Москвы (примерно в пределах МКАД): [min_lon, min_lat, max_lon, max_lat].
  # Обход не выходит за рамку. Для другого города — поменять bbox.
  bbox: [37.35, 55.57, 37.85, 55.92]
  # Минимальная дистанция между обрабатываемыми точками (м): панорамы ближе
  # к уже снятой пропускаются — так один щит не снимается с соседних панорам.
  # Было 75. Замер прогона на 200 панорам: из 587 seed-точек 247 отброшено
  # как «слишком близко» — половину улиц не осмотрели вовсе. Для щита вдоль
  # трассы 75 м оправданы: один щит виден с нескольких точек. Табличка
  # «ПРОДАЮ» на заборе читается метров с двадцати, и при шаге 75 м заборы
  # между точками пропускаются физически.
  min_distance_m: 40

dedup:
  # Дальность до щита из панорамы не измеряется, поэтому положение самого щита
  # оценивается как точка съёмки плюс луч по азимуту на assumed_distance_m.
  # Без этого дедуп невозможен: у всех детекций с одной панорамы координаты
  # камеры совпадают, и разные щиты с одной точки склеились бы в один.
  assumed_distance_m: 25
  # Оценки положения ближе radius_m — считаем одним щитом.
  radius_m: 25
  # Совпал телефон — радиус шире (щит виден издалека), но география
  # обязательна: без неё федеральная кампания с единым номером схлопнулась бы
  # в одну запись на всю страну.
  phone_radius_m: 300

storage:
  db_path: "data/banners.sqlite"
  images_dir: "data/images"

export:
  xlsx_path: "data/banners.xlsx"


google_sheets:
  enabled: true

  # Сам ID и JSON-ключ берём из переменных окружения,
  # поэтому секретов в GitHub нет.
  spreadsheet_id: ""
  credentials_path: ""

  # Отдельная вкладка под текущий эксперимент: новые промпты и DeepSeek.
  # Вкладка создаётся автоматически, если её ещё нет. Прежние данные
  # остаются на «Лиды» и не затрагиваются.
  # Омск на отдельной вкладке, чтобы не смешивать с Московской областью.
  # Вкладка создаётся автоматически при первой записи.
  sheet_name: "Омск"
