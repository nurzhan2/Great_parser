# Конфигурация парсера баннеров.
# Значения можно переопределять через переменные окружения BP_* или флаги CLI.

http:
  user_agent: "Mozilla/5.0"
  referer: "https://yandex.ru/maps/"
  timeout: 25
  max_retries: 3
  # Анти-блок: пауза между запросами (сек) и пул прокси.
  min_delay: 0.15
  proxies: []          # напр. ["http://user:pass@host:port", ...]

panorama:
  overview_zoom: 2     # зум обзорной сшивки для детекции (0=макс, 4=мин)
  crop_zoom: 0         # зум для финального кропа баннера (0 = максимум)
  tile_workers: 16

detector:
  # backend: region (ручные регионы) | yolo (обученный) | owlv2 (zero-shot, авто)
  backend: owlv2
  owl_model: "google/owlv2-base-patch16-ensemble"
  conf: 0.22            # порог детекции; ниже — больше находок и больше ложных
  yolo_weights: "weights/banner_yolo.pt"
  # Для backend=region: нормализованные регионы (fx0,fy0,fx1,fy1) — демо/ручной режим.
  regions: []

verify:
  # Проверка, что кроп — рекламный баннер (а не стена/небо/дорога).
  enabled: true
  backend: heuristic   # heuristic (без зависимостей) | clip (zero-shot, open-clip)
  min_edge_density: 0.040
  min_colorfulness: 18.0
  min_saturation: 0.12
  clip_threshold: 0.5

ocr:
  enabled: true        # требует easyocr; если не установлен — этап пропускается
  languages: ["ru", "en"]
  gpu: true

classify:
  # backend: keyword | clip
  backend: keyword
  categories:
    - недвижимость
    - авто
    - финансы
    - медицина
    - ретейл
    - услуги
    - развлечения
    - другое

filter:
  # Сохранять ТОЛЬКО баннеры этой темы (null = сохранять все).
  # Требует рабочей классификации (OCR + ключевые слова или CLIP).
  only_category: недвижимость

crawl:
  # Рамка Москвы (примерно в пределах МКАД): [min_lon, min_lat, max_lon, max_lat].
  # Обход не выходит за рамку. Для другого города — поменять bbox.
  bbox: [37.35, 55.57, 37.85, 55.92]
  # Минимальная дистанция между обрабатываемыми точками (м): панорамы ближе
  # к уже снятой пропускаются — так один щит не снимается с соседних панорам.
  min_distance_m: 250

storage:
  db_path: "data/banners.sqlite"
  images_dir: "data/images"

export:
  xlsx_path: "data/banners.xlsx"
